apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../components/observability

namePrefix: stg-
namespace: shop-staging

patches:
  - path: api-resources.yaml
    target:
      kind: Deployment
      name: shop-.*

images:
  - name: ghcr.io/acme/shop-api
    newTag: 3.3.0-rc.1
